<!doctype html>
<html><body><canvas id="c" width="320" height="240"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');
const vs = 'attribute vec4 p; void main(){ gl_Position = p; }';
const fs = 'precision mediump float; void main(){ gl_FragColor = vec4(1.0,0.0,0.0,1.0); }';
const v = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(v, vs); gl.compileShader(v);
const f = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(f, fs); gl.compileShader(f);
const prog = gl.createProgram(); gl.attachShader(prog, v); gl.attachShader(prog, f); gl.linkProgram(prog); gl.useProgram(prog);
const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0,0, 1,0,0, 0,1,0]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
requestAnimationFrame(() => { gl.drawArrays(gl.TRIANGLES, 0, 3); window.__probeReady = true; });
</script></body></html>
